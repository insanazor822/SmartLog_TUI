name: Publish

# Releases to PyPI are driven by tags, so a version is published exactly once
# and never from an unmerged branch.
on:
  release:
    types: [published]
  workflow_dispatch:

# PyPI refuses to replace an existing filename, and a re-run would fail
# halfway through. Let a concurrent publish finish rather than collide.
concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and upload to PyPI
    runs-on: ubuntu-latest

    permissions:
      # Required by trusted publishing: PyPI verifies this workflow's identity
      # through a short-lived OIDC token instead of a stored API token.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          twine check --strict dist/*

      - name: Verify the tag matches the packaged version
        run: |
          # A tag of v2.1.0 against a pyproject of 2.0.9 would silently publish
          # the wrong version, and PyPI would then reject every later attempt
          # to fix it. Fail here instead, while it is still cheap.
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::pyproject version $VERSION does not match tag $TAG"
            exit 1
          fi
          echo "publishing $VERSION"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # The build above is the artifact; do not let the action rebuild it
          # in a way that could differ from what was verified.
          packages-dir: dist/
          skip-existing: false
          print-hash: true
